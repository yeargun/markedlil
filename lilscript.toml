# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[policy.resources]
# Match the independently measured objective builds instead of inheriting the service ceiling.
logical_work = 2000000000
[javascript]
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 15

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true

[delivery]
mode = "single"
directory = "."
select = ["index"]
entry_names = "marked.esm.js"
[delivery.entries]
index = "src/entry.lil"
browser = "src/browser.lil"
[[delivery.also]]
name = "cjs"
entries = ["index"]
format = "cjs"
es_module_marker = "always"
entry_names = "marked.cjs"
[[delivery.also]]
name = "browser"
entries = ["browser"]
format = "iife"
exports = "default"
global = "marked"
global_binding = "property"
entry_names = "marked.umd.js"

# Separate winners for codec-specific public ESM artifacts, sharing source work.
[[delivery.also]]
name = "gzip"
entries = ["index"]
codecs = "gzip"
entry_names = "marked.gzip.js"
[[delivery.also]]
name = "bytes"
entries = ["index"]
codecs = "raw"
entry_names = "marked.bytes.js"

# Keep package delivery builds serial.
[execution]
jobs = 1
