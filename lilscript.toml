[javascript]
priority = "size-first"
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
# 8.19 (measured, fleet sweep of five reserves): the naming reserve picks the
# basin, not the depth, and the curve is not monotone -- 8:+15, 16:-5, 32:+53, 64:+113
# against the declared 48. Re-measure it after any emitter change.
local_name_reserve = 16
candidate_search = "production"
function_spelling = "arrow"
# 8.16 (measured, this artifact): the beam width picks which basin the terminal
# search lands in, and the curve is not monotone -- 8:-17, 12:+0, 16:-31, 20:+40 against the
# default. It is tuned, not raised, and it drifts with the compiler, so it is
# re-measured rather than trusted. (The five largest ports do not respond to it
# at all: their width is clamped by the candidate limit before the beam binds.)
candidate_beam_width = 16

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = true
pool_strings = true
